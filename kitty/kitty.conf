# ── Font ──────────────────────────────────────────
font_family       Iosevka
font_size         10.5
disable_ligatures never

# ── Window ────────────────────────────────────────
window_padding_width     5
confirm_os_window_close  0
hide_window_decorations  no
background_opacity       1.0

# ── Paste behaviour (replaces paste_confirmation) ─
paste_actions quote-urls-at-prompt

# ── Cursor ────────────────────────────────────────
cursor                  #c8c8c8
cursor_text_color       #000000
cursor_shape            block
cursor_blink_interval   0

# ── Borders ───────────────────────────────────────
active_border_color     #808080
inactive_border_color   #222222
bell_border_color       #c8c8c8

# ── Tab bar ───────────────────────────────────────
tab_bar_style                 separator
tab_separator                 " | "
active_tab_foreground         #e0e0e0
active_tab_background         #262626
inactive_tab_foreground       #808080
inactive_tab_background       #0a0a0a
tab_bar_background            #000000

# ── ANSI palette: deeply dimmed ───────────────────
foreground            #ffffff
background            #000000
selection_foreground  #000000
selection_background  #ffffff
cursor                #ffffff
cursor_text_color     #000000
url_color             #c0c0c0

active_border_color   #ffffff
inactive_border_color #404040

# 0-7 normal, 8-15 bright
color0  #000000
color8  #6b6b6b
color1  #909090
color9  #b0b0b0
color2  #a0a0a0
color10 #c0c0c0
color3  #b0b0b0
color11 #d0d0d0
color4  #909090
color12 #b0b0b0
color5  #a0a0a0
color13 #c0c0c0
color6  #b0b0b0
color14 #d0d0d0
color7  #d8d8d8
color15 #ffffff
