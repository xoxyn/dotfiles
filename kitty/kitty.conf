# ── Font ──────────────────────────────────────────
font_family       Iosevka
font_size         10.5
disable_ligatures never

# ── Window ────────────────────────────────────────
window_padding_width     10
confirm_os_window_close  0
hide_window_decorations  no
background_opacity       1.0

# ── Paste behaviour ───────────────────────────────
paste_actions quote-urls-at-prompt

# ── Base colors ───────────────────────────────────
foreground            #ffffff
background            #000000
selection_foreground  #000000
selection_background  #ffffff

# ── Pink accent ───────────────────────────────────
cursor                #ffc0cb
cursor_text_color     #000000
url_color             #ffc0cb
active_border_color   #ffc0cb
bell_border_color     #ffc0cb
inactive_border_color #404040

# ── Cursor ────────────────────────────────────────
cursor_shape            block
cursor_blink_interval   0

# ── Tab bar ───────────────────────────────────────
tab_bar_style                 separator
tab_separator                 " | "
active_tab_foreground         #ffc0cb
active_tab_background         #000000
active_tab_font_style         bold
inactive_tab_foreground       #6b6b6b
inactive_tab_background       #000000
tab_bar_background            #000000

# ── ANSI palette ──────────────────────────────────
# 0-7 normal, 8-15 bright
color0  #000000
color8  #6b6b6b
color1  #909090
color9  #b0b0b0
color2  #a0a0a0
color10 #c0c0c0
color3  #b0b0b0
color11 #d0d0d0
color4  #909090
color12 #b0b0b0
color5  #ffc0cb
color13 #ffc0cb
color6  #b0b0b0
color14 #d0d0d0
color7  #d8d8d8
color15 #ffffff
