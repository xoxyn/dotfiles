# ~/.config/yazi/yazi.toml
# Yazi v26.5.6 — https://yazi-rs.github.io/docs/configuration/yazi

# ── Manager ────────────────────────────────────────────────────────────────────
[mgr]
# Panel width ratio: [parent, current, preview]
ratio          = [1, 1, 1]

# Sorting
sort_by        = "natural"   # 1.md < 2.md < 10.md (vs "alphabetical")
sort_sensitive = false       # case-insensitive sort
sort_reverse   = false
sort_dir_first = true        # directories always on top

# Display
linemode       = "size"      # show file sizes on the right
show_hidden    = false       # toggle with . in the default keymap
show_symlink   = true        # show → target after symlink name
scrolloff      = 5           # keep 5 files above/below cursor

# Mouse (remove events you don't need)
mouse_events   = ["click", "scroll"]


# ── Preview ────────────────────────────────────────────────────────────────────
[preview]
wrap         = "no"          # don't wrap long code lines
tab_size     = 2             # tab width in code preview
max_width    = 600           # image preview max width  (px)
max_height   = 900           # image preview max height (px)
image_filter = "lanczos3"   # best quality downscaling
image_quality = 75           # 50–90; balance quality vs cache size
image_delay  = 30            # ms to wait before sending image data


# ── Openers ────────────────────────────────────────────────────────────────────
[opener]
edit = [
  { run = "nvim %s",  block = true, for = "unix"    },
]
open = [
  { run = "xdg-open %s", for = "linux"  },
  { run = "open %s",     for = "macos"  },
]
play = [
  { run = "mpv %s", orphan = true, for = "unix" },
]
pdf = [
  { run = "zathura %s", orphan = true, for = "unix" },
]

# ── Open rules ─────────────────────────────────────────────────────────────────
[open]
# Prepend your rules so they run before the defaults
prepend_rules = [
  { mime = "application/pdf",    use = "pdf" },
  { mime = "text/*",    use = "edit" },
  { mime = "video/*",   use = "play" },
  { url  = "*.json",    use = "edit" },
]


# ── Tasks ──────────────────────────────────────────────────────────────────────
[tasks]
file_workers      = 5
plugin_workers    = 3
fetch_workers     = 5
preload_workers   = 2
process_workers   = 5
bizarre_retry     = 3
suppress_preload  = false
image_alloc       = 536870912   # 512 MiB; 0 = unlimited
image_bound       = [0, 0]      # 0 = unlimited width/height


# ── Input behaviour ────────────────────────────────────────────────────────────
[input]
cursor_blink = false


# ── Which-key menu ─────────────────────────────────────────────────────────────
[which]
sort_by        = "none"   # "none" | "key" | "desc"
sort_sensitive = false
sort_reverse   = false
